schedules:
  - id: daily-reminders
    cron: "0 8 * * *"
    workflow_ref: daily-reminders
    enabled: true

  - id: weekly-matching
    cron: "0 9 * * 1"
    workflow_ref: weekly-matching
    enabled: true

  - id: monthly-recognition
    cron: "0 10 1 * *"
    workflow_ref: monthly-recognition
    enabled: true

  - id: monthly-report
    cron: "0 11 1 * *"
    workflow_ref: monthly-report
    enabled: true
